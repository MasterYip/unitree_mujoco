robot: "go2"  # Robot name, "go2", "b2", "b2w", "h1", "go2w", "g1"
robot_scene: "scene_plane.xml" # Robot scene, /unitree_robots/[robot]/scene.xml 

domain_id: 1  # Domain id
interface: "lo" # Interface 

use_joystick: 0 # Simulate Unitree WirelessController using a gamepad
joystick_type: "xbox" # support "xbox" and "switch" gamepad layout
joystick_device: "/dev/input/js0" # Device path
joystick_bits: 16 # Some game controllers may only have 8-bit accuracy

print_scene_information: 1 # Print link, joint and sensors information of robot

enable_elastic_band: 1 # Virtual spring band, used for lifting h1

# Optional viewer camera tracking. Disabled preserves the stock free camera.
camera_follow: 0
camera_follow_body: ""       # empty = pelvis for G1, base_link otherwise
camera_lookat_offset: [0.0, 0.0, 0.0]
camera_follow_yaw: 0          # 0 = world-fixed heading; 1 = follow body yaw
camera_smoothing_tau: 0.15    # seconds; 0 disables damping
camera_distance: 3.0
camera_azimuth: 90.0
camera_elevation: -20.0
